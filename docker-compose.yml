services:
  mc:
    image: itzg/minecraft-server
    cap_add:
      - SYS_PTRACE
    environment:
      EULA: "TRUE"
      MEMORY: "6G"
      VERSION: "1.20.4"
      ENABLE_AUTOPAUSE: "FALSE"
      ONLINE_MODE: "FALSE"
    ports:
      - "25565:25565"
      - "25575:25575"
    volumes:
      - ./data:/data
    restart: unless-stopped
